<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAZAAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;font-family:Arial,sans-serif;color:#111}
.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}
header{background:#111;color:#fff;padding:18px 20px;font-size:25px;font-weight:700}
.screen{display:none;padding:20px;padding-bottom:90px}
.screen.on{display:block}
.search{background:#f1f1f1;border:0;border-radius:14px;padding:15px;width:100%;font-size:16px;margin-bottom:18px}
h2{margin-top:5px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:22px}
.categories button{border:0;background:#eee;border-radius:12px;padding:11px 14px;white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f7f7f7;border-radius:16px;padding:12px}
.pic{height:120px;background:#eee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:55px}
.price{font-size:18px;font-weight:700;margin-top:8px}
.name{margin-top:5px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:#fff;font-size:16px;margin-top:12px}
.btn.green{background:#168a45}
input,textarea,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:7px 0 12px}
textarea{min-height:90px}
.back{border:0;background:#eee;border-radius:10px;padding:10px 14px;margin-bottom:15px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px}
.nav button{border:0;background:none;font-size:12px}
.empty{text-align:center;color:#777;padding:30px}
</style>
</head>

<body>
<div class="app">

<header>BAZAAR</header>

<section id="home" class="screen on">
<input class="search" placeholder="🔎 Что вы ищете?" oninput="searchProducts(this.value)">
<div class="categories">
<button onclick="filterProducts('Телефоны')">📱 Телефоны</button>
<button onclick="filterProducts('Одежда')">👕 Одежда</button>
<button onclick="filterProducts('Обувь')">👟 Обувь</button>
<button onclick="filterProducts('Дом')">🏠 Дом</button>
</div>
<h2>Популярные товары</h2>
<div id="products" class="products"></div>
</section>

<section id="search" class="screen">
<h2>🔎 Поиск</h2>
<input class="search" placeholder="Введите название товара" oninput="searchProducts(this.value)">
<div id="searchProducts" class="products"></div>
</section>

<section id="orders" class="screen">
<h2>📦 Заказы</h2>
<div class="empty">Пока заказов нет</div>
</section>

<section id="profile" class="screen">
<h2>👤 Профиль</h2>
<div id="profileContent"></div>
</section>

<section id="seller" class="screen">
<button class="back" onclick="show('profile')">← Назад</button>
<h2>🏪 Стать продавцом</h2>

<label>Название магазина</label>
<input id="shopName" placeholder="Например: Doniyor Store">

<label>Телефон</label>
<input id="shopPhone" placeholder="+998 90 123 45 67" type="tel">

<button class="btn green" onclick="registerSeller()">Зарегистрировать магазин</button>
</section>

<section id="dashboard" class="screen">
<button class="back" onclick="show('profile')">← Профиль</button>
<h2>🏪 Мой магазин</h2>
<div id="shopInfo"></div>
<button class="btn green" onclick="show('addProduct')">➕ Добавить товар</button>
<h3>Мои товары</h3>
<div id="sellerProducts"></div>
</section>

<section id="addProduct" class="screen">
<button class="back" onclick="show('dashboard')">← Назад</button>
<h2>➕ Новый товар</h2>

<label>Название товара</label>
<input id="productName" placeholder="Например: iPhone 15">

<label>Цена</label>
<input id="productPrice" type="number" placeholder="6800000">

<label>Категория</label>
<select id="productCategory">
<option>Телефоны</option>
<option>Одежда</option>
<option>Обувь</option>
<option>Дом</option>
</select>

<label>Описание</label>
<textarea id="productDescription" placeholder="Описание товара"></textarea>

<button class="btn green" onclick="addProduct()">Опубликовать товар</button>
</section>

<nav class="nav">
<button onclick="show('home')">🏠<br>Главная</button>
<button onclick="show('search')">🔎<br>Поиск</button>
<button onclick="show('orders')">📦<br>Заказы</button>
<button onclick="show('profile')">👤<br>Профиль</button>
</nav>

</div>

<script>
let products=[
{n:'iPhone 15 128GB',p:6800000,c:'Телефоны',e:'📱'},
{n:'Nike Air Max',p:520000,c:'Обувь',e:'👟'},
{n:'AirPods',p:850000,c:'Телефоны',e:'🎧'},
{n:'Apple Watch',p:1900000,c:'Телефоны',e:'⌚'}
];

let seller=JSON.parse(localStorage.getItem('bazaarSeller')||'null');

let savedProducts=JSON.parse(localStorage.getItem('bazaarProducts')||'[]');
products=products.concat(savedProducts);

function money(n){
return Number(n).toLocaleString('ru-RU')+' сум';
}

function card(x){
return `
<div class="card">
<div class="pic">${x.e||'🛍️'}</div>
<div class="name">${x.n}</div>
<div class="price">${money(x.p)}</div>
</div>`;
}

function render(list=products){
document.getElementById('products').innerHTML=list.map(card).join('');
document.getElementById('searchProducts').innerHTML=list.map(card).join('');
}

function show(id){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
document.getElementById(id).classList.add('on');

if(id==='profile')renderProfile();
if(id==='dashboard')renderDashboard();
}

function searchProducts(q){
q=q.toLowerCase();
let list=products.filter(x=>x.n.toLowerCase().includes(q));
render(list);
}

function filterProducts(c){
render(products.filter(x=>x.c===c));
}

function registerSeller(){
let name=document.getElementById('shopName').value.trim();
let phone=document.getElementById('shopPhone').value.trim();

if(!name||!phone){
alert('Заполните название магазина и телефон');
return;
}

seller={name,phone};
localStorage.setItem('bazaarSeller',JSON.stringify(seller));

alert('Магазин успешно зарегистрирован!');
show('dashboard');
}

function renderProfile(){
let box=document.getElementById('profileContent');

if(seller){
box.innerHTML=`
<p>🏪 <b>${seller.name}</b></p>
<p>📞 ${seller.phone}</p>
<button class="btn green" onclick="show('dashboard')">🏪 Управление магазином</button>
`;
}else{
box.innerHTML=`
<p>Покупатель</p>
<button class="btn" onclick="show('seller')">🏪 Стать продавцом</button>
`;
}
}

function renderDashboard(){
document.getElementById('shopInfo').innerHTML=
`<p>🏪 <b>${seller.name}</b></p><p>📞 ${seller.phone}</p>`;

let mine=products.filter(x=>x.owner);
document.getElementById('sellerProducts').innerHTML=
mine.length?mine.map(card).join(''):'<div class="empty">У вас пока нет товаров</div>';
}

function addProduct(){
let n=document.getElementById('productName').value.trim();
let p=document.getElementById('productPrice').value;
let c=document.getElementById('productCategory').value;
let d=document.getElementById('productDescription').value.trim();

if(!n||!p){
alert('Введите название и цену');
return;
}

let item={
n:n,
p:Number(p),
c:c,
e:'🛍️',
description:d,
owner:true
};

products.push(item);

let saved=JSON.parse(localStorage.getItem('bazaarProducts')||'[]');
saved.push(item);
localStorage.setItem('bazaarProducts',JSON.stringify(saved));

document.getElementById('productName').value='';
document.getElementById('productPrice').value='';
document.getElementById('productDescription').value='';

alert('Товар опубликован!');
render();
show('dashboard');
}

render();
renderProfile();
</script>

</body>
</html>
