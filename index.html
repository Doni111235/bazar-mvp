<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAZAAR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f3f5;color:#111;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding-bottom:78px}
header{background:#111;color:#fff;padding:20px;font-size:26px;font-weight:800}
.screen{display:none;padding:20px}.screen.on{display:block}
.search,input,textarea,select{width:100%;border:1px solid #ddd;border-radius:13px;padding:14px;font-size:16px;background:#fff}
.search{background:#f1f1f1;border:0;margin-bottom:14px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.categories button{border:0;background:#eee;border-radius:12px;padding:11px 14px;white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.order,.panel{background:#f7f7f7;border-radius:16px;padding:14px;margin-bottom:12px}
.pic{height:130px;background:#eee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}.name{font-weight:600;margin-top:9px}.shop{font-size:13px;color:#777;margin-top:6px}.price{font-size:18px;font-weight:800;margin-top:8px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:#fff;font-size:16px;margin-top:10px}.green{background:#168a45}.red{background:#c62828}.gray{background:#eee;color:#111}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 4px;z-index:20}
.nav button{border:0;background:none;font-size:12px}.empty{text-align:center;color:#777;padding:30px 10px}.back{border:0;background:#eee;border-radius:10px;padding:10px 14px;margin-bottom:15px}
.badge{display:inline-block;background:#eee;border-radius:8px;padding:5px 8px;font-size:13px}.admin{background:#fff3cd}.muted{color:#777;font-size:13px}
label{display:block;font-size:14px;font-weight:600;margin-top:12px}.row{display:flex;gap:8px}.row>*{flex:1}
h2{margin-top:4px}.error{color:#c00;background:#fff0f0;padding:12px;border-radius:12px;margin:10px 0}
.footer{text-align:center;color:#888;font-size:12px;padding:10px}
</style>
</head>
<body>
<div class="app">
<header>BAZAAR</header>

<section id="home" class="screen on">
<input id="homeSearch" class="search" placeholder="🔎 Что вы ищете?" oninput="searchProducts(this.value)">
<div class="categories">
<button onclick="filterProducts('')">Все</button><button onclick="filterProducts('Телефоны')">📱 Телефоны</button>
<button onclick="filterProducts('Одежда')">👕 Одежда</button><button onclick="filterProducts('Обувь')">👟 Обувь</button>
<button onclick="filterProducts('Дом')">🏠 Дом</button>
</div>
<h2>Популярные товары</h2><div id="products" class="products"></div>
</section>

<section id="search" class="screen"><h2>🔎 Поиск</h2><input id="searchInput" class="search" placeholder="Название товара" oninput="searchProducts(this.value)"><div id="searchProducts" class="products"></div></section>

<section id="orders" class="screen"><h2>📦 Заказы</h2><div id="ordersList"></div></section>

<section id="profile" class="screen"><h2>👤 Профиль</h2><div id="profileContent"></div></section>

<section id="seller" class="screen">
<button class="back" onclick="show('profile')">← Назад</button><h2>🏪 Стать продавцом</h2>
<label>Название магазина</label><input id="shopName" placeholder="Например: Doniyor Store">
<label>Телефон</label><input id="shopPhone" placeholder="+998 90 123 45 67">
<label>Описание</label><textarea id="shopDescription" placeholder="О магазине"></textarea>
<label>Адрес</label><input id="shopAddress" placeholder="Ташкент">
<button class="btn green" onclick="registerSeller()">Зарегистрировать магазин</button>
</section>

<section id="dashboard" class="screen">
<button class="back" onclick="show('profile')">← Профиль</button><h2>🏪 Мой магазин</h2><div id="shopInfo"></div>
<button class="btn green" onclick="show('addProduct')">➕ Добавить товар</button><h3>Мои товары</h3><div id="sellerProducts"></div>
</section>

<section id="addProduct" class="screen">
<button class="back" onclick="show('dashboard')">← Назад</button><h2>➕ Новый товар</h2>
<label>Название</label><input id="productName" placeholder="Например: Футболка BAZAAR">
<label>Цена, сум</label><input id="productPrice" type="number" placeholder="150000">
<label>Категория</label><select id="productCategory"><option>Телефоны</option><option>Одежда</option><option>Обувь</option><option>Дом</option></select>
<label>Описание</label><textarea id="productDescription"></textarea>
<label>Фото URL (необязательно)</label><input id="productImage" placeholder="https://...">
<button class="btn green" onclick="addProduct()">Опубликовать товар</button>
</section>

<section id="admin" class="screen">
<h2>👑 Админ-панель</h2><div id="adminStats"></div>
<h3>Пользователи</h3><div id="adminUsers"></div>
<h3>Товары</h3><div id="adminProducts"></div>
<h3>Заказы</h3><div id="adminOrders"></div>
</section>

<nav class="nav">
<button onclick="show('home')">🏠<br>Главная</button><button onclick="show('search')">🔎<br>Поиск</button>
<button onclick="show('orders')">📦<br>Заказы</button><button onclick="show('profile')">👤<br>Профиль</button>
</nav>
</div>

<script>
const SUPABASE_URL='https://evhpfeuvfmssvvvuqctw.supabase.co';
const SUPABASE_KEY='sb_publishable_eKZ4dHphZIAQqxHAQDvYDg_sirWJoIF';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, products=[], shop=null;

function money(n){return Number(n||0).toLocaleString('ru-RU')+' сум'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function telegramUser(){
  const tg=window.Telegram?.WebApp;
  if(tg){tg.ready(); return tg.initDataUnsafe?.user||null}
  return {id:999001,username:'test_user',first_name:'Тестовый пользователь'};
}
async function ensureUser(){
  const u=telegramUser();
  let {data,error}=await db.from('users').select('*').eq('telegram_id',u.id).maybeSingle();
  if(error) throw error;
  if(!data){
    const r=await db.from('users').insert({telegram_id:u.id,username:u.username||null,full_name:[u.first_name,u.last_name].filter(Boolean).join(' '),role:u.id==999001?'admin':'buyer'}).select().single();
    if(r.error) throw r.error; data=r.data;
  }
  me=data;
}
async function loadProducts(){
  const r=await db.from('products').select('id,created_at,shop_id,name,description,price,image_url,is_active,shops(id,name,phone,address)').eq('is_active',true).order('created_at',{ascending:false});
  if(r.error) throw r.error;
  products=r.data||[]; renderProducts(products);
}
function productCard(x,admin=false){
 return `<div class="card"><div class="pic">${x.image_url?`<img src="${esc(x.image_url)}">`:'🛍️'}</div>
 <div class="name">${esc(x.name)}</div><div class="shop">🏪 ${esc(x.shops?.name||'Магазин')}</div>
 <div class="price">${money(x.price)}</div><div class="muted">${esc(x.description||'')}</div>
 ${admin?`<button class="btn red" onclick="toggleProduct(${x.id},${x.is_active})">${x.is_active?'Скрыть':'Показать'}</button>`:`<button class="btn" onclick="buy(${x.id})">Купить</button>`}</div>`;
}
function renderProducts(list){document.getElementById('products').innerHTML=list.length?list.map(productCard).join(''):'<div class="empty">Товаров пока нет</div>';document.getElementById('searchProducts').innerHTML=list.map(productCard).join('')}
function searchProducts(q){q=q.toLowerCase();renderProducts(products.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)))}
function filterProducts(c){renderProducts(c?products.filter(x=>x.category===c):products)}
async function buy(productId){
 const p=products.find(x=>x.id===productId); if(!p) return;
 const phone=prompt('Ваш телефон:',me?.phone||''); if(phone===null)return;
 const address=prompt('Адрес доставки:','Ташкент'); if(address===null)return;
 const r=await db.from('orders').insert({buyer_id:me.id,shop_id:p.shop_id,status:'pending',total:p.price,phone,delivery_address:address}).select().single();
 if(r.error){alert('Ошибка создания заказа: '+r.error.message);return}
 const ri=await db.from('order_items').insert({order_id:r.data.id,product_id:p.id,quantity:1,price:p.price});
 if(ri.error){alert('Заказ создан, но товар не добавлен: '+ri.error.message);return}
 alert('Заказ успешно создан! №'+r.data.id); show('orders');
}
async function loadOrders(){
 const r=await db.from('orders').select('id,created_at,buyer_id,shop_id,status,total,phone,delivery_address,shops(name)').eq('buyer_id',me.id).order('id',{ascending:false});
 const box=document.getElementById('ordersList');
 if(r.error){box.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}
 box.innerHTML=r.data?.length?r.data.map(o=>`<div class="order"><b>📦 Заказ №${o.id}</b><div class="shop">🏪 ${esc(o.shops?.name||'Магазин')}</div><p>Статус: <span class="badge">${esc(o.status)}</span></p><div class="price">${money(o.total)}</div><p>📍 ${esc(o.delivery_address||'')}</p><p class="muted">📞 ${esc(o.phone||'')}</p></div>`).join(''):'<div class="empty">Пока заказов нет</div>'
}
function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');
 if(id==='profile')renderProfile(); if(id==='orders')loadOrders(); if(id==='dashboard')renderDashboard(); if(id==='admin')loadAdmin();
}
function renderProfile(){
 let box=document.getElementById('profileContent');
 box.innerHTML=`<div class="panel"><b>👤 ${esc(me?.full_name||me?.username||'Пользователь')}</b><p class="muted">@${esc(me?.username||'')}</p><p>Роль: <span class="badge ${me?.role==='admin'?'admin':''}">${esc(me?.role||'buyer')}</span></p></div>`;
 if(me?.role==='admin')box.innerHTML+=`<button class="btn" onclick="show('admin')">👑 Админ-панель</button>`;
 if(me?.role==='seller')box.innerHTML+=`<button class="btn green" onclick="show('dashboard')">🏪 Мой магазин</button>`;
 else if(me?.role==='buyer')box.innerHTML+=`<button class="btn green" onclick="show('seller')">🏪 Стать продавцом</button>`;
 box.innerHTML+=`<button class="btn gray" onclick="show('orders')">📦 Мои заказы</button>`;
}
async function registerSeller(){
 const name=document.getElementById('shopName').value.trim(),phone=document.getElementById('shopPhone').value.trim();
 if(!name||!phone)return alert('Заполните название и телефон');
 const s=await db.from('shops').insert({owner_id:me.id,name,description:document.getElementById('shopDescription').value.trim(),phone,address:document.getElementById('shopAddress').value.trim(),is_active:true}).select().single();
 if(s.error)return alert('Ошибка магазина: '+s.error.message);
 const u=await db.from('users').update({role:'seller',phone}).eq('id',me.id);
 if(u.error)return alert('Магазин создан, но роль не изменена: '+u.error.message);
 me.role='seller';shop=s.data;alert('Магазин зарегистрирован!');show('dashboard');
}
async function renderDashboard(){
 const r=await db.from('shops').select('*').eq('owner_id',me.id).maybeSingle(); if(r.error)return;
 shop=r.data;if(!shop){show('seller');return}
 document.getElementById('shopInfo').innerHTML=`<div class="panel"><b>🏪 ${esc(shop.name)}</b><p>${esc(shop.description||'')}</p><p>📞 ${esc(shop.phone||'')}</p><p>📍 ${esc(shop.address||'')}</p></div>`;
 const p=await db.from('products').select('*,shops(name)').eq('shop_id',shop.id).order('id',{ascending:false});
 document.getElementById('sellerProducts').innerHTML=p.data?.length?p.data.map(productCard).join(''):'<div class="empty">Товаров пока нет</div>';
}
async function addProduct(){
 if(!shop){alert('Сначала создайте магазин');return}
 const name=document.getElementById('productName').value.trim(),price=Number(document.getElementById('productPrice').value);
 if(!name||!price)return alert('Введите название и цену');
 const r=await db.from('products').insert({shop_id:shop.id,name,price,description:document.getElementById('productDescription').value.trim(),image_url:document.getElementById('productImage').value.trim()||null,is_active:true}).select().single();
 if(r.error)return alert('Ошибка: '+r.error.message);
 alert('Товар опубликован!');document.getElementById('productName').value='';document.getElementById('productPrice').value='';document.getElementById('productDescription').value='';document.getElementById('productImage').value='';await loadProducts();show('dashboard');
}
async function loadAdmin(){
 if(me.role!=='admin')return;
 const [u,p,o]=await Promise.all([
  db.from('users').select('*').order('id',{ascending:false}),
  db.from('products').select('*,shops(name)').order('id',{ascending:false}),
  db.from('orders').select('*,shops(name)').order('id',{ascending:false})
 ]);
 document.getElementById('adminStats').innerHTML=`<div class="panel">👥 Пользователей: <b>${u.data?.length||0}</b> · 🛍️ Товаров: <b>${p.data?.length||0}</b> · 📦 Заказов: <b>${o.data?.length||0}</b></div>`;
 document.getElementById('adminUsers').innerHTML=(u.data||[]).map(x=>`<div class="panel"><b>#${x.id} ${esc(x.full_name||x.username||'')}</b><br>Telegram: ${x.telegram_id}<br>Роль: <span class="badge">${esc(x.role)}</span></div>`).join('');
 document.getElementById('adminProducts').innerHTML=(p.data||[]).map(x=>productCard(x,true)).join('');
 document.getElementById('adminOrders').innerHTML=(o.data||[]).map(x=>`<div class="panel"><b>📦 №${x.id}</b> · ${esc(x.status)} · <b>${money(x.total)}</b><br>🏪 ${esc(x.shops?.name||'')}<br>📍 ${esc(x.delivery_address||'')}</div>`).join('');
}
async function toggleProduct(id,current){const r=await db.from('products').update({is_active:!current}).eq('id',id);if(r.error)alert(r.error.message);else{await loadProducts();loadAdmin()}}
async function init(){
 try{await ensureUser();await loadProducts();renderProfile()}catch(e){document.getElementById('products').innerHTML='<div class="error">Ошибка подключения: '+esc(e.message)+'</div>'}
}
init();
</script>
</body></html>
