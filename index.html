<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAZAAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;font-family:Arial,sans-serif;color:#111}
.app{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding-bottom:64px}
header{background:#111;color:#fff;padding:18px 20px;font-size:25px;font-weight:700}
.screen{display:none;padding:20px}
.screen.on{display:block}
.search{background:#f1f1f1;border:0;border-radius:14px;padding:15px;width:100%;font-size:16px;margin-bottom:18px}
h2{margin-top:5px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:22px}
.categories button{border:0;background:#eee;border-radius:12px;padding:11px 14px;white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f7f7f7;border-radius:16px;padding:12px}
.pic{height:140px;background:#eee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.price{font-size:18px;font-weight:700;margin-top:8px}
.name{margin-top:5px}
.shop{font-size:13px;color:#777;margin-top:7px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:#fff;font-size:16px;margin-top:12px;cursor:pointer}
.btn.green{background:#168a45}
.back{border:0;background:#eee;border-radius:10px;padding:10px 14px;margin-bottom:15px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px;z-index:10}
.nav button{border:0;background:none;font-size:12px;cursor:pointer}
.empty{text-align:center;color:#777;padding:30px}
input,textarea,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:7px 0 12px}
textarea{min-height:90px}
.notice{padding:12px;background:#f1f1f1;border-radius:12px;margin-bottom:15px}
.error{color:#b00020}
.loading{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<div class="app">
<header>BAZAAR</header>

<section id="home" class="screen on">
<input class="search" placeholder="🔎 Что вы ищете?" oninput="searchProducts(this.value)">
<div class="categories">
<button onclick="render(products)">Все</button>
<button onclick="filterProducts('Телефоны')">📱 Телефоны</button>
<button onclick="filterProducts('Одежда')">👕 Одежда</button>
<button onclick="filterProducts('Обувь')">👟 Обувь</button>
<button onclick="filterProducts('Дом')">🏠 Дом</button>
</div>
<h2>Популярные товары</h2>
<div id="products" class="products"><div class="loading">Загрузка товаров...</div></div>
</section>

<section id="search" class="screen">
<h2>🔎 Поиск</h2>
<input class="search" placeholder="Введите название товара" oninput="searchProducts(this.value)">
<div id="searchProducts" class="products"></div>
</section>

<section id="orders" class="screen">
<h2>📦 Заказы</h2>
<div id="ordersList"><div class="loading">Загрузка...</div></div>
</section>

<section id="profile" class="screen">
<h2>👤 Профиль</h2>
<div class="notice">Покупатель BAZAAR</div>
<button class="btn" onclick="show('orders');loadOrders()">📦 Мои заказы</button>
</section>

<section id="product" class="screen">
<button class="back" onclick="show('home')">← Назад</button>
<div id="productDetail"></div>
</section>

<nav class="nav">
<button onclick="show('home')">🏠<br>Главная</button>
<button onclick="show('search')">🔎<br>Поиск</button>
<button onclick="show('orders');loadOrders()">📦<br>Заказы</button>
<button onclick="show('profile')">👤<br>Профиль</button>
</nav>
</div>

<script>
const SUPABASE_URL='https://evhpfeuvfmssvvvuqctw.supabase.co';
const SUPABASE_KEY='sb_publishable_eKZ4dHphZIAQqxHAQDvYDg_sirWJoIF';

let products=[];
let currentProduct=null;

async function api(path,options={}){
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    ...options,
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      'Prefer':options.prefer||'return=representation',
      ...(options.headers||{})
    }
  });
  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch(e){data=text}
  if(!res.ok) throw new Error(data?.message||data?.hint||data?.details||text||('HTTP '+res.status));
  return data;
}

function money(n){return Number(n||0).toLocaleString('ru-RU')+' сум'}

function card(x){
  const image=x.image_url
    ? `<img src="${escapeHtml(x.image_url)}" onerror="this.parentElement.innerHTML='🛍️'">`
    : '🛍️';
  return `<div class="card">
    <div class="pic">${image}</div>
    <div class="name">${escapeHtml(x.name)}</div>
    <div class="shop">🏪 ${escapeHtml(x.shop_name||'Магазин')}</div>
    <div class="price">${money(x.price)}</div>
    <button class="btn" onclick="openProduct(${x.id})">Подробнее</button>
  </div>`;
}

function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function render(list){
  const html=list.length?list.map(card).join(''):'<div class="empty">Товаров пока нет</div>';
  document.getElementById('products').innerHTML=html;
  document.getElementById('searchProducts').innerHTML=html;
}

function filterProducts(c){render(products.filter(x=>x.category===c))}
function searchProducts(q){
  q=q.toLowerCase().trim();
  render(products.filter(x=>x.name.toLowerCase().includes(q)));
}

function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

async function loadProducts(){
  try{
    const data=await api('products?select=id,created_at,shop_id,name,description,price,image_url,is_active,shops(name)&is_active=eq.true&order=created_at.desc');
    products=(data||[]).map(x=>({
      ...x,
      shop_name:x.shops?.name||'Магазин',
      category:guessCategory(x.name,x.description)
    }));
    render(products);
  }catch(e){
    document.getElementById('products').innerHTML='<div class="empty error">Ошибка загрузки товаров.<br>'+escapeHtml(e.message)+'</div>';
  }
}

function guessCategory(name,desc){
  const s=(name+' '+(desc||'')).toLowerCase();
  if(/телефон|iphone|samsung|xiaomi|airpods|watch/.test(s)) return 'Телефоны';
  if(/обув|кроссов|nike|adidas|ботин/.test(s)) return 'Обувь';
  if(/футбол|рубаш|куртк|одежд|плать|штанд/.test(s)) return 'Одежда';
  if(/дом|мебел|кухн|стол|стул/.test(s)) return 'Дом';
  return '';
}

async function openProduct(id){
  currentProduct=products.find(x=>x.id===id);
  if(!currentProduct)return;
  const x=currentProduct;
  const image=x.image_url?`<img src="${escapeHtml(x.image_url)}" style="width:100%;max-height:350px;object-fit:cover;border-radius:16px">`:'<div class="pic" style="height:260px">🛍️</div>';
  document.getElementById('productDetail').innerHTML=`
    ${image}
    <h2>${escapeHtml(x.name)}</h2>
    <div class="shop">🏪 ${escapeHtml(x.shop_name)}</div>
    <div class="price">${money(x.price)}</div>
    <p>${escapeHtml(x.description||'Описание отсутствует')}</p>
    <button class="btn green" onclick="buyProduct()">🛒 Купить</button>`;
  show('product');
}

async function buyProduct(){
  if(!currentProduct)return;
  const buyerId=1;
  const shopId=currentProduct.shop_id;
  const total=Number(currentProduct.price);

  try{
    const order=await api('orders',{
      method:'POST',
      body:JSON.stringify({
        buyer_id:buyerId,
        shop_id:shopId,
        status:'pending',
        total:total,
        phone:'+998901234567',
        delivery_address:'Ташкент'
      })
    });
    const orderId=order[0]?.id;
    if(!orderId)throw new Error('Не удалось получить номер заказа');

    await api('order_items',{
      method:'POST',
      body:JSON.stringify({
        order_id:orderId,
        product_id:currentProduct.id,
        quantity:1,
        price:total
      })
    });

    alert('Заказ успешно создан! №'+orderId);
    await loadOrders();
    show('orders');
  }catch(e){
    alert('Ошибка создания заказа: '+e.message);
  }
}

async function loadOrders(){
  const box=document.getElementById('ordersList');
  box.innerHTML='<div class="loading">Загрузка заказов...</div>';
  try{
    const data=await api('orders?select=id,created_at,status,total,phone,delivery_address,shops(name)&buyer_id=eq.1&order=created_at.desc');
    if(!data?.length){box.innerHTML='<div class="empty">Пока заказов нет</div>';return}
    box.innerHTML=data.map(o=>`
      <div class="card" style="margin-bottom:12px">
        <b>Заказ №${o.id}</b>
        <div class="shop">🏪 ${escapeHtml(o.shops?.name||'Магазин')}</div>
        <p>Статус: <b>${escapeHtml(o.status)}</b></p>
        <div class="price">${money(o.total)}</div>
        <p>📍 ${escapeHtml(o.delivery_address||'')}</p>
      </div>`).join('');
  }catch(e){
    box.innerHTML='<div class="empty error">Ошибка загрузки заказов.<br>'+escapeHtml(e.message)+'</div>';
  }
}

loadProducts();
</script>
</body>
</html>
