<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAZAAR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;font-family:Arial,sans-serif;color:#111}
.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}
header{background:#111;color:#fff;padding:18px 20px;font-size:25px;font-weight:700}
.screen{display:none;padding:20px;padding-bottom:90px}.screen.on{display:block}
.search{background:#f1f1f1;border:0;border-radius:14px;padding:15px;width:100%;font-size:16px;margin-bottom:18px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:22px}.categories button{border:0;background:#eee;border-radius:12px;padding:11px 14px;white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#f7f7f7;border-radius:16px;padding:12px}
.pic{height:120px;background:#eee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}.price{font-size:18px;font-weight:700;margin-top:8px}
.name{margin-top:5px}.shop{color:#777;font-size:13px;margin-top:5px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:#fff;font-size:16px;margin-top:12px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px;z-index:10}
.nav button{border:0;background:none;font-size:12px}.empty,.loading{text-align:center;color:#777;padding:30px}
.error{background:#ffe5e5;color:#b00020;padding:15px;border-radius:12px}
</style>
</head>
<body>
<div class="app">
<header>BAZAAR</header>
<section id="home" class="screen on">
<input class="search" placeholder="🔎 Что вы ищете?" oninput="searchProducts(this.value)">
<div class="categories">
<button onclick="filterProducts('all')">Все</button><button onclick="filterProducts('Телефоны')">📱 Телефоны</button>
<button onclick="filterProducts('Одежда')">👕 Одежда</button><button onclick="filterProducts('Обувь')">👟 Обувь</button><button onclick="filterProducts('Дом')">🏠 Дом</button>
</div>
<h2>Популярные товары</h2><div id="products" class="products"><div class="loading">Загрузка товаров...</div></div>
</section>
<section id="search" class="screen"><h2>🔎 Поиск</h2><input class="search" placeholder="Введите название товара" oninput="searchProducts(this.value)"><div id="searchProducts" class="products"></div></section>
<section id="orders" class="screen"><h2>📦 Заказы</h2><div id="ordersList" class="empty">Пока заказов нет</div></section>
<section id="profile" class="screen"><h2>👤 Профиль</h2><div id="profileContent"><div class="loading">Загрузка...</div></div></section>
<nav class="nav"><button onclick="show('home')">🏠<br>Главная</button><button onclick="show('search')">🔎<br>Поиск</button><button onclick="show('orders')">📦<br>Заказы</button><button onclick="show('profile')">👤<br>Профиль</button></nav>
</div>
<script>
const SUPABASE_URL='https://evhpfeuvfmssvvvuqctw.supabase.co';
const SUPABASE_KEY='sb_publishable_eKZ4dHphZIAQqxHAQDvYDg_sirWJoIF';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();}
let products=[];
function money(n){return Number(n).toLocaleString('ru-RU')+' сум';}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
async function loadProducts(){
const box=document.getElementById('products');box.innerHTML='<div class="loading">Загрузка товаров...</div>';
const {data,error}=await supabaseClient.from('products').select('id,shop_id,name,description,price,image_url,is_active,shops(id,name)').eq('is_active',true).order('created_at',{ascending:false});
if(error){console.error(error);box.innerHTML='<div class="error">Ошибка загрузки товаров.<br><br>'+esc(error.message)+'</div>';return;}
products=data||[];renderProducts(products);
}
function card(p){const image=p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'🛍️';return '<div class="card"><div class="pic">'+image+'</div><div class="name">'+esc(p.name)+'</div><div class="shop">🏪 '+esc(p.shops?.name||'Магазин')+'</div><div class="price">'+money(p.price)+'</div><button class="btn" onclick="openProduct('+p.id+')">Подробнее</button></div>';}
function renderProducts(list){document.getElementById('products').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Товаров пока нет</div>';document.getElementById('searchProducts').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Ничего не найдено</div>';}
function searchProducts(q){q=q.toLowerCase().trim();renderProducts(products.filter(x=>x.name.toLowerCase().includes(q)));}
function filterProducts(c){renderProducts(c==='all'?products:products.filter(x=>x.category===c));}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;alert(p.name+'\n\n'+(p.shops?.name||'Магазин')+'\n'+money(p.price)+'\n\n'+(p.description||'Описание отсутствует'));}
async function buyProduct(id){
const p=products.find(x=>x.id===id);
if(!p)return;

const phone=prompt('Введите номер телефона для заказа:','+998');
if(!phone)return;

const address=prompt('Введите адрес доставки:','Ташкент');
if(!address)return;

const {data:order,error:orderError}=await supabaseClient
.from('orders')
.insert({
buyer_id:1,
shop_id:p.shop_id,
status:'pending',
total:p.price,
phone:phone,
delivery_address:address
})
.select('id')
.single();

if(orderError){
console.error(orderError);
alert('Не удалось создать заказ: '+orderError.message);
return;
}

const {error:itemError}=await supabaseClient
.from('order_items')
.insert({
order_id:order.id,
product_id:p.id,
quantity:1,
price:p.price
});

if(itemError){
console.error(itemError);
alert('Заказ создан, но товар не добавился в заказ: '+itemError.message);
return;
}

alert('✅ Заказ №'+order.id+' создан!');
show('orders');
}

function renderProfile(){document.getElementById('profileContent').innerHTML='<p>👤 <b>BAZAAR</b></p>';}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='profile')renderProfile();}
loadProducts();renderProfile();
</script>
</body>
</html>
